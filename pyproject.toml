[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sbtr"
dynamic = ["version"]
requires-python = "==3.11.*"
dependencies = [
    "biopython>=1.84",
    "huggingface-hub>=1.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly==6.0",
    "kaleido==0.2.1",
    "scipy>=1.13",
    "torch>=2.5",
    "tqdm>=4.66",
    "transformers>=5.6",
]

[project.optional-dependencies]
train = ["torchmetrics>=1.4"]
preprocessing = ["beautifulsoup4>=4.12", "openpyxl>=3.1", "requests>=2.32"]

[project.scripts]
sbtr = "sbtr.cli:main"
sbtr-fetch-model = "sbtr.fetch_local_model:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sbtr = ["data/**/*"]

[tool.setuptools.dynamic]
version = {attr = "sbtr._version.__version__"}

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
