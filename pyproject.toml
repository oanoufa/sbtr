[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sbtr"
version = "0.2.0"
requires-python = "==3.11.*"
dependencies = [
    "biopython==1.87",
    "bs4>=0.0.2",
    "huggingface-hub==1.11.0",
    "kaleido==0.2.1",
    "matplotlib==3.10.8",
    "numpy==2.4.3",
    "openpyxl>=3.1.5",
    "pandas==3.0.2",
    "plotly==6.7.0",
    "requests>=2.34.2",
    "scipy==1.17.1",
    "torch==2.11.0",
    "torchmetrics==1.9.0",
    "tqdm==4.67.3",
    "transformers==5.6.1",
    "uv==0.12.20",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
include = ["python_scripts*"]
